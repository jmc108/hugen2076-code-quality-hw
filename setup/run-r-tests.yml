name: R tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out this repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
          use-public-rspm: true

      - name: Install testthat
        shell: Rscript {0}
        run: install.packages("testthat")

      - name: Run tests
        run: Rscript --vanilla run_tests.R
